dependencies {
    // Anvil Lib
    api(libs.anvillib)
    interfaceInjectionData(libs.anvillib.recipe)
    interfaceInjectionData(libs.anvillib.moveableEntityBlock)

    // Ageratum 藿香
    api(libs.ageratum)

    // AnvilCraft
    implementation(libs.anvilcraft) { transitive = false }
    interfaceInjectionData(libs.anvilcraft) { transitive = false }

    // JEI
    compileOnlyApi(libs.jeiCommonApi) { transitive = false }
    compileOnlyApi(libs.jeiForgeApi) { transitive = false }
    implementation(libs.jeiForgeImpl) { transitive = false }

    // Jade
    implementation(libs.jade)

    // Curios API (optional compatibility, not a required dependency)
    compileOnly("top.theillusivec4.curios:curios-neoforge:${libs.versions.curios.get()}:api")
    runtimeOnly(libs.curios)
}
